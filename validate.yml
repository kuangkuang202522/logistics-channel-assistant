name: validate-userscript

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check userscript syntax
        run: node --check logistics-channel-assistant.user.js
