<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>物流渠道判断助手 v1.5.1</title>
<style>
  body{margin:0;padding:16px;font:15px/1.7 -apple-system,"Microsoft YaHei",sans-serif;background:#eef2f7;color:#0f172a}
  h1{font-size:18px;margin:0 0 12px}

  .meta{color:#6b7280;font-size:13px}

  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}

  .topbar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  #result select{padding:4px 6px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px}
</style>

<body>
<div class="topbar">
  <div class="brand">物流渠道判断助手 <span class="ver">v1.5.1</span></div>
  <div class="actions">
    <a class="install" href="./logistics-channel-assistant.user.js">安装 / 更新篡改猴脚本</a>
    <a class="gh" href="https://github.com/kuangkuang202522/logistics-channel-assistant" target="_blank" rel="noopener">GitHub</a>
  </div>
</div>
<h1>物流渠道判断（全部国家 / 全部渠道）</h1>

<div class="card">
  <textarea id="input" placeholder="直接把马帮货件页「全选复制」的内容粘进来即可（会自己找：货件单号、店铺、国家、物流中心编码、运输方式）。
也兼容旧格式：每行「货件号 仓库码 [地址]」，或只写仓库码。"></textarea>
  <div class="row">
    <label>运输方式</label>
    <select id="method">
      <option value="auto">自动识别（粘进来的内容里有就用）</option>
      <option value="海运">海运</option>
      <option value="空运">空运</option>
      <option value="卡航">卡航</option>
      <option value="快递">快递</option>
      <option value="铁路">铁路</option>
    </select>
    <label><input type="checkbox" id="usGroup" checked style="vertical-align:-2px"> 美国按「5个货件」一组分配</label>
    <label>天盛票数/组</label>
    <input id="quota" type="number" min="0" max="5" value="3" style="width:60px">
    <label>本周另一家</label>
    <select id="other"><option>瑞易达</option><option>铭运</option></select>
    <label>美国空运货型</label>
    <select id="airtype"><option>普货</option><option>药贴</option></select>
  </div>
  <div class="row">
    <label>德国货代</label>
    <select id="deCarrier"><option>铭运</option><option>瑞易达</option></select>
    <label>英国货代</label>
    <select id="ukCarrier"><option>瑞易达</option><option>铭运</option></select>
    <label>加拿大货代</label>
    <select id="caCarrier"><option>铭运</option><option>瑞易达</option></select>
    <button id="run">判断</button>
  </div>
  <div class="hint">美国：同一个「货件名称」下的 5 个货件为一组，天盛先占美东、再美西、最后美中（默认 3 票），其余给本周另一家；不是 5 个一组的单个货件逐票手动选货代。其他国家按上面选定的货代自动带出渠道。</div>
</div>

<div class="card" id="result"><div class="meta">结果会显示在这里。</div></div>

<script>
var SPECIAL = {
  MCI4:["美东","特例仓，需单独报关"], MEM1:["美中","特例仓"], RFD2:["美东","特例仓"],
  TOL3:["美东","特例仓"], LAN2:["美东","特例仓"], AKR1:["美东","特例仓"],
  LAX9:["美西","特例仓"], CMH2:["美东","特例仓"], CMH3:["美东","特例仓"],
  BJC1:["美东","特例仓"],
  IMO1:["美东","特例仓，天盛海运盛森提"],
  ITX3:["美东","特例仓，天盛海运盛森提"],
  ICA3:["美东","特例仓，天盛海运盛森提"]
};
var KNOWN = {
  GYR3:"美西",GYR2:"美西",SBD1:"美西",SCK4:"美西",ONT8:"美西",LGB8:"美西",VGT2:"美西",
  PSP3:"美西",LAS1:"美西",SMF3:"美西",MIT2:"美西",POC1:"美西",POC3:"美西",ABQ2:"美西",MCC1:"美西",
  MQJ1:"美中",IND9:"美中",MDW2:"美中",FTW1:"美中",FWA4:"美中",IAH3:"美中",BJC1:"美东",
  ABE8:"美东",AVP1:"美东",CLT2:"美东",TEB9:"美东",RDU2:"美东",ORF2:"美东",RMN3:"美东",
  MQY2:"美东",HGR6:"美东",ABE1:"美东",ABE2:"美东",ABE3:"美东",ABE4:"美东",ABE5:"美东"
};
var CA_EAST = ["XYY4","YYZ1","YYZ2","YYZ3","YYZ4","YYZ5","YYZ6","YYZ7","YYZ8","YYZ9","Y001","YOO1","YHM1","YXU1","YGK1","YOW1","YOW2","YOW3","YUL2"];
var CA_WEST = ["YVR1","YVR2","YVR3","YVR4","YXX2","YYC1","YYC2","YYC3","YYC4","YYC5","YYC6","YEG1","YEG2"];

var US_SEA = {
  "天盛":{美东:"盛森提",美中:"美中-盛森达Pro",美西:"美西-盛森达Pro"},
  "瑞易达":{美东:"美森限时达",美中:"美中-美森正班卡派",美西:"美西-美森正班卡派"},
  "铭运":{美东:"美森快船正班船-UPS派",美中:"美中-美森快船正班船-卡派",美西:"美西-美森快船正班船-卡派"}
};
var CA_SEA = {
  "铭运":{加东:"加东-美转加美森正班限时达-卡派",加西:"加西-美转加美森正班限时达-卡派",其余:"美转加美森正班限时达-UPS派"},
  "瑞易达":{加东:"加拿大海运",加西:"加拿大海运",其余:"加拿大海运"}
};
var CA_AIR = {"瑞易达":"加拿大空运-CN","铭运":"加拿大空运"};
var DE_AIR = {"铭运":"欧洲空派包税B价-大陆飞","瑞易达":"欧洲空运CN"};
var DE_TRUCK = {"铭运":"欧洲卡航-包税","瑞易达":"中欧卡航包税"};
var UK_AIR = {"瑞易达":"英国空运-CN","铭运":"英国空派-递延不包税"};
var UK_TRUCK = {"瑞易达":"英国卡航VAT","铭运":"英国卡航-递延"};
var EXPRESS = {"瑞易达":"UPS-WE特快包税"};
var TS_SPECIAL = ["IMO1","ITX3","ICA3"];
var METHOD_NAMES = ["海运","空运","卡航","快递","铁路"];
var COUNTRY_NAMES = ["美国","加拿大","德国","英国","法国","意大利","西班牙","荷兰","波兰"];
var EU_TRUCK = {"瑞易达":"中欧丝路"};

var ROWS = [];

function zipOf(address){
  var tokens = String(address || "").replace(/[-,，]/g, " ").split(" ");
  var hits = tokens.filter(function(t){ return /^[0-9]{5}$/.test(t); });
  return hits.length ? hits[hits.length - 1] : "";
}
function usRegion(code, address){
  if (SPECIAL[code]) return SPECIAL[code];
  var zip = zipOf(address);
  if (zip){
    var d = parseInt(zip[0], 10);
    if (d <= 3) return ["美东","邮编首位"];
    if (d <= 7) return ["美中","邮编首位"];
    return ["美西","邮编首位"];
  }
  if (KNOWN[code]) return [KNOWN[code],"已核对仓表"];
  return ["","未收录仓库"];
}
function caRegion(code, address){
  if (CA_EAST.indexOf(code) >= 0) return ["加东","加拿大仓名单"];
  if (CA_WEST.indexOf(code) >= 0) return ["加西","加拿大仓名单"];
  var up = String(address || "").toUpperCase();
  if (/( ON| QC| NB| NS| PE| NL)/.test(up)) return ["加东","省份缩写"];
  if (/( BC| AB| SK| MB)/.test(up)) return ["加西","省份缩写"];
  return ["其余","加拿大仓不在东西名单"];
}
function countryFromStore(store){
  var m = String(store||"").match(/号(美国|加拿大|德国|英国|法国|意大利|西班牙|荷兰|波兰)站/);
  return m ? m[1] : "";
}
function normalizeMethod(value){
  var text = String(value || "").trim();
  var m = text.match(/(海运|空运|卡航|快递|铁路)/);
  return m ? m[1] : text;
}
function isKnownMethod(value){ return METHOD_NAMES.indexOf(value) >= 0; }
function isTsSpecialWarehouse(code){ return TS_SPECIAL.indexOf(String(code || "").trim().toUpperCase()) >= 0; }
function parseShipments(text){
  var re = /FBA[0-9A-Z]{8,}/g, map = {}, order = [], m, matches = [];
  while ((m = re.exec(text)) !== null) matches.push({no:m[0], idx:m.index});
  matches.forEach(function(item, i){
    var end = (i + 1 < matches.length) ? matches[i+1].idx : text.length;
    var seg = text.slice(item.idx, end);
    var rec = map[item.no];
    if (!rec){ rec = map[item.no] = {no:item.no, store:"", country:"", wh:"", method:"", weight:"", address:"", name:""}; order.push(item.no); }
    var store = (seg.match(/店铺\s*([0-9]+号[^\s\n站]*站)/) || [])[1] || "";
    var country = (seg.match(/国家\s*(美国|加拿大|德国|英国|法国|意大利|西班牙|荷兰|波兰)/) || [])[1] || "";
    var wh = (seg.match(/物流中心编码\s*([A-Z0-9]{3,6})/) || [])[1] || "";
    var weight = (seg.match(/装箱总重量\s*([0-9.]+)\s*kg/) || [])[1] || "";
    var shipName = (seg.match(/货件名称\s*([A-Za-z0-9]+)/) || [])[1] || "";
    var mm = seg.match(/(海运|空运|卡航|快递|铁路)/g);
    var method = mm ? mm[mm.length - 1] : "";
    if (!rec.store && store) rec.store = store;
    if (!rec.country && country) rec.country = country;
    if (!rec.wh && wh) rec.wh = wh.toUpperCase();
    if (!rec.weight && weight) rec.weight = weight;
    if (!rec.method && method) rec.method = method;
    if (!rec.autoMethod && method) rec.autoMethod = method;
    if (!rec.name && shipName) rec.name = shipName;
  });
  return order.map(function(no){ return map[no]; });
}
function parseLegacy(text){
  var rows = [];
  text.split(/\r?\n/).forEach(function(line){
    line = line.trim();
    if (!line) return;
    var parts = line.split(/[\t ]+/);
    var no = "", wh = "";
    if (/^FBA[0-9A-Z]{8,}$/.test(parts[0])) { no = parts[0]; parts.shift(); }
    if (parts.length && /^[A-Z]{2,4}[0-9]?$/.test(parts[0].toUpperCase())) { wh = parts[0].toUpperCase(); parts.shift(); }
    var address = parts.join(" ");
    if (no || wh) rows.push({no:no, store:"", country:"", wh:wh, address:address, method:"", weight:""});
  });
  return rows;
}
function parseInput(text){
  var rows = parseShipments(text);
  return rows.length ? rows : parseLegacy(text);
}
function pickChannel(row, carrier, method, airtype){
  var c = row.country || "美国", zone = row.zone;
  if (c === "美国"){
    if (method === "海运") return (US_SEA[carrier] && US_SEA[carrier][zone]) || "";
    if (method === "空运") { if (carrier === "天盛") return airtype === "药贴" ? "天敏提" : "天翼提"; return ""; }
    if (method === "快递") return EXPRESS[carrier] || "";
    return "";
  }
  if (c === "加拿大"){
    if (method === "海运" || method === "卡航") return (CA_SEA[carrier] && CA_SEA[carrier][zone]) || "";
    if (method === "空运") return CA_AIR[carrier] || "";
    if (method === "快递") return EXPRESS[carrier] || "";
    return "";
  }
  if (c === "德国"){
    if (method === "空运") return DE_AIR[carrier] || "";
    if (method === "卡航") return DE_TRUCK[carrier] || "";
    return "";
  }
  if (c === "英国"){
    if (method === "空运") return UK_AIR[carrier] || "";
    if (method === "卡航") return UK_TRUCK[carrier] || "";
    if (method === "快递") return EXPRESS[carrier] || "";
    return "";
  }
  if (["法国","意大利","西班牙","荷兰","波兰"].indexOf(c) >= 0){
    if (method === "卡航") return EU_TRUCK[carrier] || "";
    return "";
  }
  return "";
}

function readOptions(){
  return {
    methodSel: document.getElementById("method").value,
    useUsGroup: document.getElementById("usGroup").checked,
    quota: parseInt(document.getElementById("quota").value, 10) || 0,
    other: document.getElementById("other").value,
    airtype: document.getElementById("airtype").value,
    deCarrier: document.getElementById("deCarrier").value,
    ukCarrier: document.getElementById("ukCarrier").value,
    caCarrier: document.getElementById("caCarrier").value
  };
}

function analyze(){
  var opts = readOptions();
  ROWS.forEach(function(r, i){
    r.idx = i;
    r.country = r.country || countryFromStore(r.store) || "美国";
    if (r.country === "美国"){ var u = usRegion(r.wh, r.address); r.zone = u[0]; r.basis = u[1]; }
    else if (r.country === "加拿大"){
      if (r.manualZone){ r.zone = r.manualZone; r.basis = "手动指定"; }
      else { var c = caRegion(r.wh, r.address); r.zone = c[0]; r.basis = c[1]; }
    }
    else r.zone = r.country;
    var rawMethod = r.manualMethod || r.autoMethod || r.method || "";
    var normalized = normalizeMethod(rawMethod);
    var detected = isKnownMethod(normalized);
    r.methodMissing = !detected && !r.manualMethod && opts.methodSel === "auto";
    if (opts.methodSel === "auto") r.method = detected ? normalized : (r.country === "美国" ? "海运" : "");
    else { r.method = opts.methodSel; r.methodMissing = false; }
  });

  // 美国：每 5 个货件一组，组内天盛按 美东→美西→美中 占票
  var priority = {美东:0, 美西:1, 美中:2, "":3};
  var usRows = ROWS.filter(function(r){ return r.country === "美国"; });
  usRows.forEach(function(r){ r.group = ""; r.assigned = ""; });
  if (opts.useUsGroup){
    // 优先按「货件名称」分组：同一货件名称下的 5 个货件才按 3+2 分配
    var byName = {}, unnamed = [], gid = 0;
    usRows.forEach(function(r){ if (r.name){ (byName[r.name] = byName[r.name] || []).push(r); } else { unnamed.push(r); } });
    Object.keys(byName).forEach(function(name){
      var group = byName[name];
      if (group.length !== 5) return;
      gid += 1;
      var ordered = group.slice().sort(function(a,b){ return (priority[a.zone]-priority[b.zone]) || (a.idx-b.idx); });
      ordered.forEach(function(r, k){
        r.group = "第" + gid + "组";
        r.assigned = k < opts.quota ? "天盛" : opts.other;
      });
    });
    // 旧的简易输入没有货件名称时，退回按连续 5 个一组
    for (var start = 0; start + 5 <= unnamed.length; start += 5){
      var group = unnamed.slice(start, start + 5);
      gid += 1;
      var ordered = group.slice().sort(function(a,b){ return (priority[a.zone]-priority[b.zone]) || (a.idx-b.idx); });
      ordered.forEach(function(r, k){
        r.group = "第" + gid + "组";
        r.assigned = k < opts.quota ? "天盛" : opts.other;
      });
    }
  }

  ROWS.forEach(function(r){
    if (r.country === "美国"){
      if (r.method === "海运" && isTsSpecialWarehouse(r.wh)) r.assigned = "天盛";
      if (r.assigned) r.carrier = r.assigned;
      else if (r.carrierTouched) r.carrier = r.manualCarrier;
      else if (r.method === "海运") r.carrier = "天盛";
      else r.carrier = "";
    } else if (r.country === "加拿大") r.carrier = opts.caCarrier;
    else if (r.country === "英国") r.carrier = opts.ukCarrier;
    else if (r.country === "德国") r.carrier = opts.deCarrier;
    else if (["法国","意大利","西班牙","荷兰","波兰"].indexOf(r.country) >= 0) r.carrier = "瑞易达";
    else r.carrier = "待定";
    r.channel = r.carrier ? pickChannel(r, r.carrier, r.method, opts.airtype) : "";
    if (r.carrier && !r.channel) r.channel = "待确认（该货代无此渠道）";
    if (!r.carrier) r.channel = "待选货代";
  });
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
var CARRIER_THEME = {
  "天盛":{cls:"ts"}, "瑞易达":{cls:"ryd"}, "铭运":{cls:"my"},
  "待分配":{cls:"todo"}, "待定":{cls:"pending"}
};
function carrierTheme(name){ return CARRIER_THEME[name] || {cls:"other"}; }

function render(){
  var result = document.getElementById("result");
  if (!ROWS.length){ result.innerHTML = '<div class="bad">没识别到货件。</div>'; return; }
  analyze();
  var groups = {};
  ROWS.forEach(function(r){
    var key = r.carrier || "待分配";
    (groups[key] = groups[key] || []).push(r);
  });
  var fixed = ["天盛","瑞易达","铭运","待分配","待定"];
  var keys = fixed.filter(function(k){ return groups[k]; }).concat(Object.keys(groups).filter(function(k){ return fixed.indexOf(k) < 0; }));
  var chips = keys.map(function(key){
    var theme = carrierTheme(key);
    return `<span class="sum-chip ${theme.cls}">${esc(key)} <b>${groups[key].length}</b> 票</span>`;
  }).join("");
  var html = `<div class="lca-summary">${chips}<span class="sum-total">共 ${ROWS.length} 票</span></div>`;
  keys.forEach(function(key){
    var rows = groups[key], theme = carrierTheme(key), groupNames = [];
    rows.forEach(function(r){ if (r.group && groupNames.indexOf(r.group) < 0) groupNames.push(r.group); });
    var sub = groupNames.length ? `<span class="carrier-sub">${esc(groupNames.join(" / "))}</span>` : "";
    html += `<section class="carrier-section ${theme.cls}">`;
    html += `<div class="carrier-head"><span class="carrier-badge">${esc(key)}</span><span class="carrier-count">${rows.length} 票</span>${sub}</div>`;
    html += `<table><thead><tr><th>货件号</th><th>店铺</th><th>国家</th><th>仓库</th><th>分区</th><th>方式</th><th>货代</th><th>渠道名</th><th>依据/提示</th></tr></thead><tbody>`;
    rows.forEach(function(r){
      var warn = "";
      if (!r.wh) warn = '<span class="warn">缺仓库码</span>';
      else if (r.country === "美国" && !r.zone) warn = '<span class="warn">仓库未收录，请补邮编</span>';
      else if (r.methodMissing) warn = '<span class="warn">未识别运输方式，请选择</span>';
      if (r.channel && r.channel.indexOf("待确认") === 0) warn += ' <span class="bad">渠道待确认</span>';
      var carrierCell;
      if (r.country === "美国" && !r.assigned){
        var sel = `<select onchange="window.__setCarrier('${r.no}', this.value)">`;
        sel += `<option value=""${r.carrier ? "" : " selected"}>待选</option>`;
        ["天盛","瑞易达","铭运"].forEach(function(c){
          sel += `<option value="${c}"${r.carrier === c ? " selected" : ""}>${c}</option>`;
        });
        sel += `</select>`;
        carrierCell = sel + (r.group ? ` <span class="group">${esc(r.group)}</span>` : ' <span class="group">单票</span>');
      } else {
        carrierCell = esc(r.carrier || "") + (r.group ? ` <span class="group">${esc(r.group)}</span>` : '');
      }
      var zoneCell = esc(r.zone || "");
      if (r.country === "加拿大" && (r.basis === "加拿大仓不在东西名单" || r.basis === "手动指定")){
        var zsel = `<select onchange="window.__setCaZone('${r.no}', this.value)">`;
        ["加东","加西","其余"].forEach(function(z){ zsel += `<option value="${z}"${r.zone === z ? " selected" : ""}>${z}</option>`; });
        zsel += `</select>`;
        zoneCell = zsel;
      }
      var methodSelected = r.manualMethod || r.method || "";
      var autoLabel = r.autoMethod ? `自动（${r.autoMethod}）` : "自动";
      var methodOptions = METHOD_NAMES.map(function(m){ return `<option value="${m}"${m === methodSelected ? " selected" : ""}>${m}</option>`; }).join("");
      var methodCell = `<select onchange="window.__setMethod('${r.no}', this.value)" title="可随时改；选「自动」恢复自动识别"><option value=""${methodSelected ? "" : " selected"}>${autoLabel}</option>${methodOptions}</select>`;
      html += `<tr><td class="shipno">${esc(r.no)}</td><td>${esc(r.store || "")}</td><td>${esc(r.country || "")}</td><td>${esc(r.wh || "")}</td><td>${zoneCell}</td><td>${methodCell}</td><td>${carrierCell}</td><td class="ch">${esc(r.channel || "")}</td><td>${esc(r.basis || "")} ${warn}</td></tr>`;
    });
    html += `</tbody></table></section>`;
  });
  result.innerHTML = html;
}

window.__setCaZone = function(no, value){
  var row = ROWS.filter(function(r){ return r.no === no; })[0];
  if (row){ row.manualZone = value; render(); }
};

window.__setCarrier = function(no, value){
  var row = ROWS.filter(function(r){ return r.no === no; })[0];
  if (row){ row.manualCarrier = value; row.carrierTouched = true; render(); }
};

window.__setMethod = function(no, value){
  var row = ROWS.filter(function(r){ return r.no === no; })[0];
  if (!row) return;
  if (value){ row.manualMethod = value; row.method = value; row.methodMissing = false; }
  else { row.manualMethod = ""; row.method = row.autoMethod || ""; row.methodMissing = !isKnownMethod(normalizeMethod(row.method)); }
  render();
};

function run(){
  var text = document.getElementById("input").value || "";
  ROWS = parseInput(text);
  ROWS.forEach(function(r){ r.manualCarrier = ""; r.manualMethod = ""; r.carrierTouched = false; });
  render();
}

document.getElementById("run").addEventListener("click", run);
</script>
